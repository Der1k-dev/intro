<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>STAR WARS RP - Завантаження</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%; height: 100%;
        background: #08080e;
        overflow: hidden;
        font-family: 'Segoe UI', 'Consolas', monospace;
        color: #e8eaee;
    }

    /* --- Фон: сітка + зорі --- */
    .bg {
        position: fixed; inset: 0;
        background-image:
            linear-gradient(rgba(255,140,40,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,140,40,0.05) 1px, transparent 1px);
        background-size: 46px 46px;
        z-index: 0;
    }
    .stars {
        position: fixed; inset: 0;
        z-index: 0;
        background-repeat: repeat;
        opacity: 0.5;
    }
    .stars span {
        position: absolute;
        width: 2px; height: 2px;
        background: #fff;
        border-radius: 50%;
        opacity: 0.5;
        animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.8; } }

    .vignette {
        position: fixed; inset: 0; z-index: 1;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
        pointer-events: none;
    }

    /* --- Кутові дужки --- */
    .bracket {
        position: fixed;
        width: 70px; height: 70px;
        border: 2px solid #ff8c28;
        z-index: 2;
        opacity: 0.9;
    }
    .bracket.tl { top: 26px; left: 26px; border-right: none; border-bottom: none; }
    .bracket.tr { top: 26px; right: 26px; border-left: none; border-bottom: none; }
    .bracket.bl { bottom: 90px; left: 26px; border-right: none; border-top: none; }
    .bracket.br { bottom: 90px; right: 26px; border-left: none; border-top: none; }

    /* --- Лого + слоган --- */
    .brand {
        position: fixed; left: 60px; bottom: 130px; z-index: 3;
        max-width: 640px;
    }
    .brand img {
        max-width: 460px;
        filter: drop-shadow(0 0 24px rgba(255,140,40,0.35));
        opacity: 0;
        animation: fadeUp 0.8s ease forwards 0.3s;
    }
    .tagline {
        margin-top: 18px;
        font-size: 16px;
        letter-spacing: 3px;
        color: #9aa2ad;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeUp 0.8s ease forwards 0.6s;
    }
    .tagline b { color: #ff8c28; }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* --- Термінальний лог справа --- */
    .terminal {
        position: fixed; top: 60px; right: 60px; z-index: 3;
        width: 420px;
        font-size: 13px;
        letter-spacing: 1px;
    }
    .terminal .head {
        color: #ff8c28;
        font-weight: bold;
        margin-bottom: 14px;
        display: flex; justify-content: space-between;
    }
    .terminal .line {
        display: flex; justify-content: space-between;
        color: #7c8592;
        padding: 3px 0;
        opacity: 0;
        animation: fadeIn 0.4s ease forwards;
    }
    .terminal .line .ok { color: #6fdc82; }
    @keyframes fadeIn { to { opacity: 1; } }

    /* --- Картка гравця --- */
    .playercard {
        position: fixed; top: 250px; right: 60px; z-index: 3;
        width: 420px;
        background: rgba(16,20,28,0.85);
        border: 1px solid #3c4655;
        border-left: 3px solid #ff8c28;
        padding: 18px 20px;
        opacity: 0;
        animation: fadeUp 0.6s ease forwards 1.4s;
    }
    .playercard .label { color: #ff8c28; font-size: 12px; letter-spacing: 2px; margin-bottom: 6px; }
    .playercard .name { font-size: 26px; font-weight: bold; color: #fff; margin-bottom: 14px; word-break: break-all; }
    .playercard .row { display: flex; justify-content: space-between; font-size: 13px; color: #9aa2ad; padding: 3px 0; }
    .playercard .row b { color: #e8eaee; }

    /* --- Нижній статус-бар --- */
    .statusbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
        height: 66px;
        background: rgba(8,8,14,0.92);
        border-top: 2px solid #ff8c28;
        display: flex; align-items: center;
        padding: 0 40px;
    }
    .statusbar .dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #ff8c28;
        margin-right: 12px;
        animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    .statusbar .text { flex: 1; font-size: 14px; letter-spacing: 1px; color: #c7cbd1; }
    .statusbar .pct { font-size: 16px; font-weight: bold; color: #ff8c28; min-width: 60px; text-align: right; }

    .progresstrack {
        position: fixed; left: 0; right: 0; bottom: 66px; height: 3px; z-index: 3;
        background: rgba(255,255,255,0.06);
    }
    .progressfill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #ff8c28, #ffb35c);
        box-shadow: 0 0 12px rgba(255,140,40,0.6);
        transition: width 0.3s ease;
    }
</style>
</head>

I1Ko4Q9gACQiIiIaccIJfwADIBEREdGIEm74A4D/B6SAj+Hh/hqmAAAAAElFTkSuQmCC" alt="STAR WARS RP">
        <div class="tagline">Грай. <b>Досліджуй.</b> Насолоджуйся.</div>
    </div>

    <div class="terminal" id="terminal">
        <div class="head"><span>SYS::CONNECT</span><span id="serverAddr">...</span></div>
    </div>

    <div class="playercard">
        <div class="label">ГРАВЕЦЬ / PLAYER</div>
        <div class="name" id="playerName">Guest</div>
        <div class="row"><span>SteamID</span><b id="playerSteamId">-</b></div>
        <div class="row"><span>Карта</span><b id="mapName">-</b></div>
        <div class="row"><span>Гравців</span><b id="maxPlayers">-</b></div>
    </div>

    <div class="progresstrack"><div class="progressfill" id="progressFill"></div></div>
    <div class="statusbar">
        <div class="dot"></div>
        <div class="text" id="statusText">Ініціалізація...</div>
        <div class="pct" id="statusPct">0%</div>
    </div>

<script>
    // --- Зорі ---
    var starsEl = document.getElementById('stars');
    for (var i = 0; i < 60; i++) {
        var s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3) + 's';
        starsEl.appendChild(s);
    }

    // --- Параметри з URL. ВАЖЛИВО: GMod передає лише %s (SteamID64)
    // і %m (назва карти) - ІМ'Я гравця так передати не можна, бо
    // LocalPlayer():Nick() існує лише всередині Lua-рушія, а ця
    // сторінка - звичайний окремий HTML, доступу до гри не має.
    // Показуємо SteamID (єдине, що реально прийде), нік - ні.
    var params = new URLSearchParams(window.location.search);
    var steamId = params.get('steamid') || params.get('SteamId') || '';
    var mapParam = params.get('map') || params.get('Map') || '';

    if (steamId) {
        document.getElementById('playerName').textContent = 'STEAM_' + steamId.slice(-6);
        document.getElementById('playerSteamId').textContent = steamId;
    }
    if (mapParam) {
        document.getElementById('mapName').textContent = mapParam;
    }

    // --- Термінальний лог - послідовна анімація рядків ---
    var logLines = [
        ['HANDSHAKE', 'OK'],
        ['AUTH / STEAM SESSION', 'OK'],
        ['WORKSHOP CONTENT', 'LOADING'],
        ['GAMEMODE STAR WARS RP', 'MOUNTED'],
        ['SPAWN POINT', 'RESERVED'],
        ['CHARACTER DATA', 'SYNCING'],
        ['WORLD STREAM', 'ACTIVE'],
    ];
    var termEl = document.getElementById('terminal');
    logLines.forEach(function (item, idx) {
        var row = document.createElement('div');
        row.className = 'line';
        row.style.animationDelay = (0.3 + idx * 0.22) + 's';
        row.innerHTML = '<span>&gt; ' + item[0] + '</span><span class="ok">[' + item[1] + ']</span>';
        termEl.appendChild(row);
    });

    // --- Прогрес: справжні дані від GMod, якщо є, інакше плавна
    // імітація (щоб екран не виглядав "зламаним", якщо колбеки
    // з якоїсь причини не прийдуть).
    var filesTotal = 0, filesDone = 0;
    var fillEl = document.getElementById('progressFill');
    var textEl = document.getElementById('statusText');
    var pctEl = document.getElementById('statusPct');

    function setProgress(pct, text) {
        pct = Math.max(0, Math.min(100, pct));
        fillEl.style.width = pct + '%';
        pctEl.textContent = Math.round(pct) + '%';
        if (text) textEl.textContent = text;
    }

    // --- Офіційні колбеки GMod (викликаються рушієм напряму) ---
    window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
        document.getElementById('mapName').textContent = mapname || '-';
        document.getElementById('maxPlayers').textContent = maxplayers || '-';
        document.getElementById('serverAddr').textContent = servername || '';
        if (steamid) {
            document.getElementById('playerName').textContent = 'STEAM_' + String(steamid).slice(-6);
            document.getElementById('playerSteamId').textContent = steamid;
        }
        setProgress(5, 'З\'єднання встановлено...');
    };

    window.SetFilesTotal = function (total) {
        filesTotal = total || 0;
        filesDone = 0;
        setProgress(filesTotal > 0 ? 5 : 30, 'Завантаження файлів: 0 / ' + filesTotal);
    };

    window.DownloadingFile = function (filename) {
        textEl.textContent = 'Завантаження: ' + filename;
    };

    window.FileDownloaded = function () {
        filesDone++;
        if (filesTotal > 0) {
            var pct = 5 + (filesDone / filesTotal) * 90;
            setProgress(pct, 'Завантаження файлів: ' + filesDone + ' / ' + filesTotal);
        }
    };

    // --- Фолбек-анімація (на випадок відсутності реальних колбеків -
    // напр. якщо всі файли вже завантажені і GMod їх не викликає) ---
    var fakeProgress = 0;
    var fakeInterval = setInterval(function () {
        if (filesTotal > 0) { clearInterval(fakeInterval); return; } // реальні дані вже йдуть
        fakeProgress += Math.random() * 6;
        if (fakeProgress >= 96) { fakeProgress = 96; clearInterval(fakeInterval); }
        setProgress(fakeProgress, 'Синхронізація світу...');
    }, 260);
</script>
